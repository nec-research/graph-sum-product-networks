dataset:
  storage_folder: DATA_MLWIZ/ogbg-molpcba_OGBGDatasetInterface
  dataset_class: dataset.OGBGDatasetInterface
  data_splits_file: DATA_SPLITS_MLWIZ/ogbg-molpcba/OGBGDatasetInterface/OGBGDatasetInterface_outer1_inner1.splits
resources:
  device: cuda
  max_cpus: 12
  max_gpus: 4
  gpus_per_task: 1
  sync_batchnorm: false
reproducibility:
  seed: 42
data_loading:
  dataset_getter: provider.DataProvider
  data_loader:
    class_name: torch_geometric.loader.DataLoader
    args:
      num_workers: 1
      pin_memory: true
experiment:
  result_folder: RESULTS_MLWIZ
  exp_name: gae_model_embedding_regression_mlp_weak_supervision_ogbg_ogbg-molpcba_OGBGDatasetInterface_mlwiz
  experiment: pipeline.EmbeddingPipeline
  model_selection_criteria:
  - metric: main_score
    direction: max
  evaluate_every: 1
  risk_assessment_training_runs: 10
  model_selection_training_runs: 1
grid:
  weak_supervision_percentage: 0.001
  encoder:
    model: baselines.GAE_Adj
    checkpoint: true
    shuffle: true
    batch_size: 1024
    epochs: 100
    embeddings_folder: UNSUP_GAE_EMBEDDINGS_BASIC/
    num_layers:
    - 2
    - 3
    - 5
    dim_embedding:
    - 32
    - 128
    - 256
    num_hidden_neurons: 0
    train_eps: true
    concat_out_across_layers: true
    optimizer:
    - class_name: mlwiz.training.callback.optimizer.Optimizer
      args:
        optimizer_class_name: torch.optim.Adam
        lr:
        - 0.1
        - 0.01
        accumulate_gradients: false
    scheduler: null
    loss: metric.DotProductLink
    scorer: metric.DotProductAccuracy
    readout: null
    engine: mlwiz.training.engine.TrainingEngine
    gradient_clipper: null
    early_stopper:
    - class_name: mlwiz.training.callback.early_stopping.PatienceEarlyStopper
      args:
        patience: 50
        monitor: validation_main_score
        mode: min
        checkpoint: true
    plotter: mlwiz.training.callback.plotter.Plotter
  predictor:
    model: readout.MLPGraphClassifier_GlobalReadout
    checkpoint: true
    shuffle: true
    batch_size: 1024
    epochs: 1000
    embeddings_folder: UNSUP_GAE_EMBEDDINGS_BASIC/
    global_pooling:
    - sum
    - mean
    hidden_units:
    - 64
    - 8
    - 32
    optimizer:
    - class_name: mlwiz.training.callback.optimizer.Optimizer
      args:
        optimizer_class_name: torch.optim.Adam
        lr:
        - 0.01
        weight_decay:
        - 0.0
        - 0.0001
    scheduler: null
    loss: metric.BCEWithLogits
    scorer:
    - class_name: mlwiz.training.callback.metric.MultiScore
      args:
        main_scorer: metric.OGBGAP
    readout: null
    engine: mlwiz.training.engine.TrainingEngine
    gradient_clipper: null
    early_stopper:
    - class_name: mlwiz.training.callback.early_stopping.PatienceEarlyStopper
      args:
        patience: 500
        monitor: validation_main_score
        mode: max
        checkpoint: true
    plotter: mlwiz.training.callback.plotter.Plotter
  embeddings_folder: EMBEDDINGS_MLWIZ
