dataset:
  storage_folder: DATA_MLWIZ/ogbg-molhiv
  dataset_class: dataset.OGBGDatasetInterface
  data_splits_file: DATA_SPLITS_MLWIZ/ogbg-molhiv/OGBGDatasetInterface/OGBGDatasetInterface_outer1_inner1.splits
resources:
  device: cuda
  max_cpus: 24
  max_gpus: 8
  gpus_per_task: 0.5
  sync_batchnorm: false
reproducibility:
  seed: 42
data_loading:
  dataset_getter: provider.WeakSupervisionDataProvider
  data_loader:
    class_name: torch_geometric.loader.DataLoader
    args:
      num_workers: 1
      pin_memory: true
experiment:
  result_folder: RESULTS_MLWIZ
  exp_name: weakly_sup_classification_GIN_ogbg_ogbg-molhiv_mlwiz
  experiment: weakly_supervised_task.WeaklySupervisedTask
  model_selection_criteria:
  - metric: main_score
    direction: max
  evaluate_every: 1
  risk_assessment_training_runs: 10
  model_selection_training_runs: 1
grid:
  model: baselines.GIN
  checkpoint: true
  shuffle: true
  batch_size:
  - 1024
  epochs: 1000
  train_eps: true
  atom_encoder_dim: 100
  global_aggregation:
  - sum
  - mean
  dim_embedding:
  - 32
  - 256
  - 512
  num_layers:
  - 2
  - 5
  dropout:
  - 0
  - 0.5
  optimizer:
  - class_name: mlwiz.training.callback.optimizer.Optimizer
    args:
      optimizer_class_name: torch.optim.Adam
      lr:
      - 0.01
      - 0.0001
      weight_decay: 0.0
  scheduler: null
  loss: metric.BCEWithLogits
  scorer:
  - class_name: mlwiz.training.callback.metric.MultiScore
    args:
      main_scorer: metric.OGBGROCAUC
  readout: null
  engine: mlwiz.training.engine.TrainingEngine
  gradient_clipper: null
  early_stopper:
  - class_name: mlwiz.training.callback.early_stopping.PatienceEarlyStopper
    args:
      patience: 500
      monitor: validation_main_score
      mode: max
      checkpoint: true
  plotter: mlwiz.training.callback.plotter.Plotter
