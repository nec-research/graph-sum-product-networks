# GSPN-GPT-FIXED: Canonical GSPN paths/settings; fresh result name avoids old checkpoints.
# GSPN-GPT-FIXED: MLWiz schema with dataset-specific result identity.
dataset:
  storage_folder: DATA_MLWIZ/benzene
  dataset_class: dataset.TUDatasetInterface
  data_splits_file: DATA_SPLITS_MLWIZ/benzene/TUDatasetInterface/TUDatasetInterface_outer1_inner1.splits
resources:
  device: cuda
  max_cpus: 24
  max_gpus: 1
  gpus_per_task: 0.25
  sync_batchnorm: false
reproducibility:
  seed: 42
data_loading:
  dataset_getter: provider.DataProvider
  data_loader:
    class_name: torch_geometric.loader.DataLoader
    args:
      num_workers: 1
      pin_memory: true
experiment:
  result_folder: RESULTS_MLWIZ
  exp_name: unsup_model_embedding_regression_mlp_weak_supervision_benzene_mlwiz_refactored
  experiment: pipeline.EmbeddingPipeline
  model_selection_criteria:
  - metric: main_score
    direction: min
  evaluate_every: 1
  risk_assessment_training_runs: 10
  model_selection_training_runs: 1
grid:
  weak_supervision_percentage: 0.001
  encoder:
    model: model.GSPN
    checkpoint: true
    shuffle: true
    batch_size: 1024
    epochs: 100
    embeddings_folder: UNSUP_GSPN_EMBEDDINGS_BASIC/
    convolution_class: model.GSPNBaseConv
    emission_class: model.GSPNMultiCategoricalEmission
    num_mixtures:
    - 10
    - 5
    - 20
    num_layers:
    - 5
    - 10
    - 20
    avg_parameters_across_layers:
    - true
    - false
    optimizer:
    - class_name: mlwiz.training.callback.optimizer.Optimizer
      args:
        optimizer_class_name: torch.optim.Adam
        lr: 0.1
        accumulate_gradients: false
    scheduler: null
    loss:
    - class_name: metric.GSPNNodeLogLikelihood
    scorer:
    - class_name: mlwiz.training.callback.metric.MultiScore
      args:
        main_scorer:
        - class_name: metric.GSPNNodeLogLikelihood
    readout: null
    engine: mlwiz.training.engine.TrainingEngine
    gradient_clipper: null
    early_stopper:
    - class_name:
      - mlwiz.training.callback.early_stopping.PatienceEarlyStopper
      args:
        patience:
        - 50
        monitor: validation_main_score
        mode: min
        checkpoint: true
    plotter: mlwiz.training.callback.plotter.Plotter
  predictor:
    model: readout.MLPGraphClassifier_GlobalReadout
    checkpoint: true
    shuffle: true
    batch_size: 1024
    epochs: 1000
    embeddings_folder: UNSUP_GSPN_EMBEDDINGS_BASIC/
    global_pooling:
    - sum
    - mean
    hidden_units:
    - 64
    - 8
    - 32
    optimizer:
    - class_name: mlwiz.training.callback.optimizer.Optimizer
      args:
        optimizer_class_name: torch.optim.Adam
        lr:
        - 0.01
        weight_decay:
        - 0.0
        - 0.0001
    scheduler: null
    loss: mlwiz.training.callback.metric.MeanAbsoluteError
    scorer:
    - class_name: mlwiz.training.callback.metric.MultiScore
      args:
        main_scorer: mlwiz.training.callback.metric.MeanAbsoluteError
    readout: null
    engine: mlwiz.training.engine.TrainingEngine
    gradient_clipper: null
    early_stopper:
    - class_name: mlwiz.training.callback.early_stopping.PatienceEarlyStopper
      args:
        patience: 500
        monitor: validation_main_loss
        mode: min
        checkpoint: true
    plotter: mlwiz.training.callback.plotter.Plotter
  embeddings_folder: EMBEDDINGS_MLWIZ
