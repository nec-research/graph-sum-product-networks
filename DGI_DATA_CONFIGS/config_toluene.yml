# GSPN-GPT-FIXED: MLWiz dataset contract and preserved evaluation partitions.
splitter:
  splits_folder: DATA_SPLITS_MLWIZ/toluene_dgi
  class_name: migration.PreservedSplitter
  args:
    n_outer_folds: 1
    n_inner_folds: 1
    seed: 42
    stratify: false
    shuffle: true
    inner_val_ratio: 0.1
    outer_val_ratio: 0.1
    test_ratio: 0.1
    legacy_splits_file: DATA_SPLITS/CHEMICAL/toluene/toluene_outer1_inner1.splits
dataset:
  class_name: dataset.TUDatasetInterface
  args:
    root: DATA
    name: toluene
    storage_folder: DATA_MLWIZ/toluene_dgi
    seed: 42
    transform_train:
      class_name: transform.Compose
      args:
        transforms:
        - class_name: transform.DGICorruption
    transform_eval:
      class_name: transform.Compose
      args:
        transforms:
        - class_name: transform.DGICorruption
