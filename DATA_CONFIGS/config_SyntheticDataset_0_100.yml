# GSPN-GPT-FIXED: MLWiz dataset contract and preserved evaluation partitions.
splitter:
  splits_folder: DATA_SPLITS_MLWIZ/SyntheticDataset_0_100
  class_name: migration.PreservedSplitter
  args:
    n_outer_folds: 1
    n_inner_folds: 1
    seed: 42
    stratify: false
    shuffle: true
    inner_val_ratio: 0.1
    outer_val_ratio: 0.1
    test_ratio: 0.1
    legacy_splits_file: DATA_SPLITS/SyntheticDataset_0_100/SyntheticDataset_0_100_outer1_inner1.splits
dataset:
  class_name: dataset.SyntheticDataset
  args:
    root: DATA
    name: SyntheticDataset
    raw_dir: GENERATED_DATA/set/missing_data/Synthetic_0_100
    per_community_weight: 0
    structure_weight: 100
    storage_folder: DATA_MLWIZ/SyntheticDataset_0_100
    seed: 42
    pre_transform:
      class_name: transform.Compose
      args:
        transforms:
        - class_name: transform.GammaRandomNodeFeaturesMask
          args:
            alpha: 1.5
            beta: 2
