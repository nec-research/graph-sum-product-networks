# GSPN-GPT-FIXED: MLWiz dataset contract and preserved evaluation partitions.
splitter:
  splits_folder: DATA_SPLITS_MLWIZ/naphthalene
  class_name: migration.PreservedSplitter
  args:
    n_outer_folds: 1
    n_inner_folds: 1
    seed: 42
    stratify: false
    shuffle: true
    inner_val_ratio: 0.1
    outer_val_ratio: 0.1
    test_ratio: 0.1
    legacy_splits_file: DATA_SPLITS/CHEMICAL/naphthalene/naphthalene_outer1_inner1.splits
dataset:
  class_name: dataset.TUDatasetInterface
  args:
    root: DATA
    name: naphthalene
    storage_folder: DATA_MLWIZ/naphthalene
    seed: 42
    pre_transform:
      class_name: transform.Compose
      args:
        transforms:
        - class_name: transform.NegativeSampling
