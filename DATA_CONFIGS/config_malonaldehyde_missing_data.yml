# GSPN-GPT-FIXED: MLWiz dataset contract and preserved evaluation partitions.
splitter:
  splits_folder: DATA_SPLITS_MLWIZ/malonaldehyde_missing
  class_name: migration.PreservedSplitter
  args:
    n_outer_folds: 1
    n_inner_folds: 1
    seed: 42
    stratify: false
    shuffle: true
    inner_val_ratio: 0.1
    outer_val_ratio: 0.1
    test_ratio: 0.1
    legacy_splits_file: DATA_SPLITS/CHEMICAL/malonaldehyde/malonaldehyde_outer1_inner1.splits
dataset:
  class_name: dataset.TUDatasetInterfaceMissingData
  args:
    root: DATA/missing_data/
    name: malonaldehyde
    storage_folder: DATA_MLWIZ/malonaldehyde_missing
    seed: 42
    pre_transform:
      class_name: transform.Compose
      args:
        transforms:
        - class_name: transform.ContinuousAttributesTUDatasetChemical
        - class_name: transform.GammaRandomNodeFeaturesMask
          args:
            alpha: 1.5
            beta: 2
