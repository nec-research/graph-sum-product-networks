# GSPN-GPT-FIXED: MLWiz schema with dataset-specific result identity.
dataset:
  storage_folder: DATA_MLWIZ/SyntheticDataset_100_0
  dataset_class: dataset.SyntheticDataset
  data_splits_file: DATA_SPLITS_MLWIZ/SyntheticDataset_100_0/SyntheticDataset/SyntheticDataset_outer1_inner1.splits
resources:
  device: cuda
  max_cpus: 32
  max_gpus: 1
  gpus_per_task: 0.5
  sync_batchnorm: false
reproducibility:
  seed: 42
data_loading:
  dataset_getter: provider.DataProvider
  data_loader:
    class_name: torch_geometric.loader.DataLoader
    args:
      num_workers: 1
      pin_memory: true
experiment:
  result_folder: RESULTS_MLWIZ
  exp_name: synthetic_gaussian_SyntheticDataset_100_0_mlwiz
  experiment: mlwiz.experiment.Experiment
  model_selection_criteria:
  - metric: main_score
    direction: min
  evaluate_every: 1
  risk_assessment_training_runs: 3
  model_selection_training_runs: 1
grid:
  model: model.GSPN
  checkpoint: true
  shuffle: true
  batch_size: 32
  epochs: 200
  convolution_class: model.GSPNBaseConv
  emission_class: model.GSPNGaussianEmission
  num_layers:
  - 2
  avg_parameters_across_layers:
  - false
  num_mixtures:
  - 5
  - 15
  - 20
  - 40
  init_max_variance: 10
  num_hidden_neurons: 0
  init_kmeans: true
  add_self_loops: false
  optimizer:
  - class_name: mlwiz.training.callback.optimizer.Optimizer
    args:
      optimizer_class_name: torch.optim.Adam
      lr:
      - 0.1
      - 0.001
      accumulate_gradients: false
  scheduler: null
  loss: metric.GSPNNodeLogLikelihood
  scorer:
  - class_name: mlwiz.training.callback.metric.MultiScore
    args:
      main_scorer: metric.GSPNNodeLogLikelihood
      imputationlikelihood: metric.ConditionalMeanImputationLikelihood
  readout: null
  engine: mlwiz.training.engine.TrainingEngine
  gradient_clipper: null
  early_stopper:
  - class_name: mlwiz.training.callback.early_stopping.PatienceEarlyStopper
    args:
      patience: 50
      monitor: validation_main_score
      mode: min
      checkpoint: true
  plotter: mlwiz.training.callback.plotter.Plotter
