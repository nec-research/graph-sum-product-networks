# GSPN-GPT-FIXED: MLWiz schema with dataset-specific result identity.
dataset:
  storage_folder: DATA_MLWIZ/NCI1
  dataset_class: dataset.TUDatasetInterface
  data_splits_file: DATA_SPLITS_MLWIZ/NCI1/TUDatasetInterface/TUDatasetInterface_outer10_inner1.splits
resources:
  device: cuda
  max_cpus: 64
  max_gpus: 3
  gpus_per_task: 0.25
  sync_batchnorm: false
reproducibility:
  seed: 42
data_loading:
  dataset_getter: provider.DataProvider
  data_loader:
    class_name: torch_geometric.loader.DataLoader
    args:
      num_workers: 2
      pin_memory: true
experiment:
  result_folder: RESULTS_MLWIZ
  exp_name: unsup_model_embedding_classification_graph_emb_CHEMICAL_NCI1_mlwiz
  experiment: pipeline.EmbeddingPipeline
  model_selection_criteria:
  - metric: main_score
    direction: max
  evaluate_every: 1
  risk_assessment_training_runs: 1
  model_selection_training_runs: 1
grid:
  encoder:
    model: model.GSPN
    checkpoint: true
    shuffle: true
    batch_size: 32
    epochs: 500
    embeddings_folder: UNSUP_GSPN_EMBEDDINGS_BASIC/
    convolution_class: model.GSPNBaseConv
    emission_class: model.GSPNCategoricalEmission
    num_mixtures:
    - 10
    - 5
    - 20
    num_hidden_neurons:
    - 0
    num_layers:
    - 2
    - 5
    - 10
    - 15
    - 20
    optimizer:
    - class_name: mlwiz.training.callback.optimizer.Optimizer
      args:
        optimizer_class_name: torch.optim.Adam
        lr: 0.1
        accumulate_gradients: false
    scheduler: null
    loss:
    - class_name: metric.GSPNNodeLogLikelihood
      args: {}
    scorer:
    - class_name: mlwiz.training.callback.metric.MultiScore
      args:
        main_scorer:
        - class_name: metric.GSPNNodeLogLikelihood
          args: {}
    readout: null
    engine: mlwiz.training.engine.TrainingEngine
    gradient_clipper: null
    early_stopper:
    - class_name:
      - mlwiz.training.callback.early_stopping.PatienceEarlyStopper
      args:
        patience:
        - 50
        monitor: validation_main_score
        mode: min
        checkpoint: true
    plotter: mlwiz.training.callback.plotter.Plotter
  predictor:
    model: readout.MLPGraphClassifier_GraphEmbedding
    checkpoint: true
    shuffle: true
    batch_size: 32
    epochs: 1000
    embeddings_folder: UNSUP_GSPN_EMBEDDINGS_BASIC/
    global_pooling: sum
    hidden_units:
    - 8
    - 16
    - 32
    - 128
    optimizer:
    - class_name: mlwiz.training.callback.optimizer.Optimizer
      args:
        optimizer_class_name: torch.optim.Adam
        lr: 0.001
    scheduler: null
    loss: mlwiz.training.callback.metric.MulticlassClassification
    scorer: mlwiz.training.callback.metric.MulticlassAccuracy
    readout: null
    engine: mlwiz.training.engine.TrainingEngine
    gradient_clipper: null
    early_stopper:
    - class_name: mlwiz.training.callback.early_stopping.PatienceEarlyStopper
      args:
        patience: 200
        monitor: validation_main_score
        mode: max
        checkpoint: true
    plotter: mlwiz.training.callback.plotter.Plotter
  embeddings_folder: EMBEDDINGS_MLWIZ
